<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>synkrew · Send Login Credentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#060d1f;
    --ink:#eaf2ff;
    --muted:#8ca3c7;
    --blue:#2563eb;
    --cyan:#22d3ee;
    --green:#34d399;
    --glass:rgba(255,255,255,.045);
    --stroke:rgba(148,163,184,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(1000px 600px at 85% -10%, rgba(37,99,235,.18), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(16,185,129,.14), transparent 60%),
      var(--bg);
    color:var(--ink);
    overflow-x:hidden;
  }

  /* ambient orbs */
  .orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
  .orb-a{width:520px;height:520px;top:-180px;left:-140px;
    background:radial-gradient(circle, rgba(37,99,235,.32), transparent 70%);
    animation:float 14s ease-in-out infinite}
  .orb-b{width:560px;height:560px;bottom:-220px;right:-160px;
    background:radial-gradient(circle, rgba(45,212,191,.24), transparent 70%);
    animation:float 18s ease-in-out infinite reverse}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.08)}}

  .grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(148,163,184,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.055) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 42%, #000 30%, transparent 100%);
    mask-image:radial-gradient(ellipse 75% 65% at 50% 42%, #000 30%, transparent 100%);
  }

  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;
    padding:clamp(20px,4vw,40px)}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-size:22px;font-weight:800;letter-spacing:-.6px}
  .brand em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--green));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    border:1px solid rgba(56,189,248,.28);background:rgba(56,189,248,.08);
    color:#7dd3fc;font-size:10.5px;font-weight:700;letter-spacing:2.2px;white-space:nowrap}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  /* hero */
  .hero{text-align:center;margin-top:clamp(46px,11vh,100px);animation:fadeUp .8s .1s both}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
    border:1px solid var(--stroke);background:var(--glass);backdrop-filter:blur(8px);
    color:#93c5fd;font-size:12.5px;font-weight:600;letter-spacing:.4px}
  .chip svg{width:14px;height:14px;stroke:#93c5fd}
  h1{font-size:clamp(34px,6.4vw,60px);font-weight:800;letter-spacing:-1.8px;line-height:1.08;
    margin-top:22px}
  .grad{background:linear-gradient(90deg,#3b82f6,#22d3ee,#34d399,#3b82f6);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 7s linear infinite}
  @keyframes shimmer{to{background-position:220% 0}}
  .sub{color:var(--muted);font-size:clamp(14px,2vw,17px);line-height:1.75;max-width:540px;
    margin:18px auto 0}

  /* bottom / button */
  .bottom{margin-top:auto;text-align:center;padding-top:60px;
    padding-bottom:clamp(26px,6vh,54px);animation:fadeUp .8s .35s both}
  .send-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:12px;
    padding:19px 44px;border-radius:999px;cursor:pointer;color:#fff;
    font-family:inherit;font-size:clamp(15px,2.2vw,17.5px);font-weight:700;letter-spacing:.3px;
    border:1px solid rgba(255,255,255,.22);
    background:linear-gradient(135deg,#2563eb 0%,#06b6d4 55%,#10b981 125%);
    background-size:190% 190%;
    box-shadow:0 12px 42px rgba(37,99,235,.45), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .25s ease, box-shadow .25s ease;
    animation:glow 3.2s ease-in-out infinite}
  @keyframes glow{
    0%,100%{box-shadow:0 12px 42px rgba(37,99,235,.42), inset 0 1px 0 rgba(255,255,255,.28)}
    50%{box-shadow:0 14px 55px rgba(34,211,238,.55), inset 0 1px 0 rgba(255,255,255,.28)}}
  .send-btn:hover{transform:translateY(-3px) scale(1.02)}
  .send-btn:active{transform:translateY(0) scale(.98)}
  .send-btn::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-20deg);animation:sweep 3.4s ease-in-out infinite}
  @keyframes sweep{0%{left:-80%}45%,100%{left:130%}}
  .send-btn svg{width:19px;height:19px;flex:none}
  .send-btn .icon-plane{animation:drift 2.6s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}
  .spin{display:none;width:19px;height:19px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .icon-check{display:none;stroke:#fff}
  .icon-check path{stroke-dasharray:26;stroke-dashoffset:26}

  .send-btn.sending{pointer-events:none;opacity:.92}
  .send-btn.sending .icon-plane{display:none}
  .send-btn.sending .spin{display:block}
  .send-btn.sent{pointer-events:none;
    background:linear-gradient(135deg,#059669,#34d399);
    border-color:rgba(255,255,255,.25);
    box-shadow:0 12px 44px rgba(16,185,129,.5)}
  .send-btn.sent::after{animation:none;display:none}
  .send-btn.sent .spin{display:none}
  .send-btn.sent .icon-plane{display:none}
  .send-btn.sent .icon-check{display:block}
  .send-btn.sent .icon-check path{animation:draw .5s .1s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .send-btn.sent .icon-check{animation:pop .5s .05s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

  .status{display:inline-flex;align-items:center;gap:8px;margin-top:20px;
    color:#64748b;font-size:13px;font-weight:500;letter-spacing:.3px;
    transition:color .4s}
  .status svg{width:14px;height:14px;stroke:#475569;transition:stroke .4s}
  .status.ok{color:var(--green)}
  .status.ok svg{stroke:var(--green)}

  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);
    transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(3.2);opacity:0}}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

  @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  @media (max-width:560px){
    .brand small{display:none}
    .send-btn{padding:17px 34px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="grid-overlay"></div>
  <canvas id="confetti"></canvas>

  <main>
    <header class="top">
      <div class="brand">synkrew<em>.</em><small>solutions</small></div>
      <div class="badge"><span class="live-dot"></span>SECURE PORTAL</div>
    </header>

    <section class="hero">
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Credential Delivery · One Click
      </span>
      <h1>Send Login <span class="grad">Credentials</span></h1>
      <p class="sub" id="sub">Deliver login credentials to all selected profiles — securely, instantly, and in style.</p>
    </section>

    <section class="bottom">
      <button class="send-btn" id="sendBtn">
        <svg class="icon-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        <span class="spin" aria-hidden="true"></span>
        <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
        <span class="btn-label" id="btnLabel">Send Login Credentials</span>
      </button>
      <br/>
      <span class="status" id="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        HIPAA Compliant · Encrypted Delivery
      </span>
    </section>
  </main>

<script>
  const btn = document.getElementById('sendBtn');
  const btnLabel = document.getElementById('btnLabel');
  const status = document.getElementById('status');
  const sub = document.getElementById('sub');
  let done = false;

  btn.addEventListener('click', (e) => {
    if (done) return;
    done = true;

    // ripple
    const rect = btn.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size / 2) + 'px';
    r.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 650);

    // sending state
    btn.classList.add('sending');
    status.innerHTML = 'Encrypting &amp; sending credentials&hellip;';

    setTimeout(() => {
      btn.classList.remove('sending');
      btn.classList.add('sent');
      btnLabel.textContent = 'Profiles Sent';
      status.classList.add('ok');
      status.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M4 12.5 9.5 18 20 6.5"/></svg> Profiles Sent — all credentials delivered successfully.';
      sub.textContent = 'All selected profiles have received their login credentials.';
      fireConfetti();
    }, 1400);
  });

  /* tiny confetti burst (no libraries) */
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize); resize();

  function fireConfetti(){
    const colors = ['#3b82f6','#22d3ee','#34d399','#a5b4fc','#f8fafc','#fbbf24'];
    const rect = btn.getBoundingClientRect();
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const parts = [];
    for (let i = 0; i < 90; i++){
      const a = Math.random() * Math.PI * 2;
      const v = 5 + Math.random() * 9;
      parts.push({
        x: ox, y: oy,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5,
        w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
        c: colors[(Math.random() * colors.length) | 0],
        rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        life: 1, decay: .011 + Math.random() * .012
      });
    }
    (function loop(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      for (const p of parts){
        if (p.life <= 0) continue;
        alive = true;
        p.vy += .22; p.vx *= .992;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
        ctx.save();
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (alive) requestAnimationFrame(loop);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    })();
  }
</script>
</body>
</html>
